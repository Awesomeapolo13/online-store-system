[program:cart-create-command-worker]
command=php /var/www/online-store-system/bin/console messenger:consume cart_create_command --time-limit=3600
process_name=%(program_name)s_%(process_num)02d
numprocs=1
directory=/var/www/online-store-system
autostart=true
autorestart=true
startsecs=5
startretries=10
user=www-data
redirect_stderr=true
stdout_logfile=/var/log/supervisor/cart-create-command-worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=10
stopwaitsecs=60
stopsignal=TERM
